[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-deep-hedging"
version = "0.2.0"
description = "Auditable NumPy implementation for deep hedging under transaction costs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
  {name = "Alpha Kabinet TOURE", email = "alpha_kabinet.toure@asr-lab.online"}
]

keywords = [
  "deep hedging",
  "transaction costs",
  "CVaR",
  "Heston model",
  "quantitative finance",
  "reproducible research",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.17.1",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Alpha-Stochastic-Research/asr-deep-hedging"
Repository = "https://github.com/Alpha-Stochastic-Research/asr-deep-hedging"
Issues = "https://github.com/Alpha-Stochastic-Research/asr-deep-hedging/issues"
Paper = "https://doi.org/10.5281/zenodo.21519919"
PyPI = "https://pypi.org/project/asr-deep-hedging/"
Changelog = "https://github.com/Alpha-Stochastic-Research/asr-deep-hedging/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
