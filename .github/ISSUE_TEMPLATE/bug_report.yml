name: Bug report
description: Report a reproducible software defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for providing a minimal, reproducible report.
  - type: input
    id: commit
    attributes:
      label: Commit or release
      placeholder: commit SHA or v0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command, configuration, seed, and smallest code snippet needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, NumPy/SciPy versions, and hardware.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
